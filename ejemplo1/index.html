<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eco WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 520px;
            margin: 40px auto;
        }

        #estado {
            font-weight: bold;
        }

        #log {
            border: 1px solid #ccc;
            height: 200px;
            overflow-y: auto;
            padding: 8px;
            background: #f8f8f8;
        }

        .yo {
            color: #0b5ed7;
        }

        .srv {
            color: #198754;
        }
    </style>
</head>

<body>
    <!--Interfaz: estado, caja de texto, botón y registro-->
    <h1> Servidor ECO</h1>
    <p>Estado: <span id="estado">Conectando...</span></p>
    <input id="mensaje" placeholder="Escribe algo">
    <button id="btnEnviar">Enviar</button>
    <div id="log"></div>

    <script>
        //Abrir la conexión WebSocket (protocolo ws://)
        const socket = new WebSocket('ws://' + location.host);
        const estado = document.getElementById('estado');
        const log = document.getElementById('log');

        //Función de ayuda: agrega una línea al registro
        function escribir(texto, clase) {
            const div = document.createElement('div');
            div.className = clase;
            div.textContent = texto; //muestra el texto tal cual (seguro)
            log.appendChild(div);
        }

        //Reaccionar a los eventos de la conexión
        //Cuando la conexión está lista, cambia el estado en la página
        socket.onopen = () => { estado.textContent = ' Conectado'; };

        //Se ejecuta cuando llega un mensaje desde el servidor 
        socket.onmessage = (evento) => {
            escribir('Servidor: ' + evento.data, 'srv');
        };

        //Actualiza el estado si la conexión se cierra
        socket.onclose = () => { estado.textContent = ' Desconectado'; };

        //Enviar el texto al pulsar el botón
        document.getElementById('btnEnviar').onclick = () => {
            const input = document.getElementById('mensaje');
            if (!input.value) return; //si está vacía, termina la función y no envía nada
            escribir('Yo: ' + input.value, 'yo'); //muestra el mensaje en el registro
            socket.send(input.value); //lo manda al servidor
            input.value = ''; //limpia el input
        };
    </script>
</body>

</html>
